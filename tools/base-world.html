<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Manu's Media Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..600&family=IBM+Plex+Mono:wght@400;500&family=Spectral+SC:wght@400;500;600&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap">
<style>/* Layout: a full-bleed survey chart with a ledger panel on the right (a bottom sheet on phones). */
:root {
  --sea: #dbe6e9;
  --sea-line: #a7c1ca;
  --paper: #f5f7f6;
  --panel: rgba(245, 247, 246, 0.96);
  --ink: #1d292e;
  --ink-2: #4a585e;
  --ink-3: #78868b;
  --rule: #c9d4d7;
  --contour: #8b6a4e;
  --border: #6d7d84;
  --accent: #b23f2b;
  --ghost: #5b717c;
  --land-l: 95.5;
  --land-c: 11;
  --m-film: #b23a48;
  --m-tv: #8b4ca0;
  --m-anime: #5559c4;
  --m-manga: #2a77b2;
  --m-comics: #1d8a83;
  --m-books: #3b8a42;
  --m-game: #a87a14;
  --m-music: #c25e27;
  --f-map: "Spectral SC", "Spectral", Georgia, "Times New Roman", serif;
  --f-serif: "Spectral", Georgia, "Times New Roman", serif;
  --f-ui: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --panel-w: 384px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sea: #0b1519; --sea-line: #23434d; --paper: #111b20; --panel: rgba(17, 27, 32, 0.96);
    --ink: #e3ebed; --ink-2: #a8b7bc; --ink-3: #74868c; --rule: #2a3a41; --contour: #c4a07c;
    --border: #8aa1a9; --accent: #f07a5f; --ghost: #8ea6b0; --land-l: 19; --land-c: 7;
    --m-film: #f07c88; --m-tv: #cc8ade; --m-anime: #9da1f5; --m-manga: #6fb2e8; --m-comics: #55c5bd;
    --m-books: #7cc97f; --m-game: #e6b84f; --m-music: #f19a62; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sea: #0b1519; --sea-line: #23434d; --paper: #111b20; --panel: rgba(17, 27, 32, 0.96);
  --ink: #e3ebed; --ink-2: #a8b7bc; --ink-3: #74868c; --rule: #2a3a41; --contour: #c4a07c;
  --border: #8aa1a9; --accent: #f07a5f; --ghost: #8ea6b0; --land-l: 19; --land-c: 7;
  --m-film: #f07c88; --m-tv: #cc8ade; --m-anime: #9da1f5; --m-manga: #6fb2e8; --m-comics: #55c5bd;
  --m-books: #7cc97f; --m-game: #e6b84f; --m-music: #f19a62; color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--sea);
  color: var(--ink);
  font: 14px/1.5 var(--f-ui);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr) var(--panel-w);
}
.stage { position: relative; min-width: 0; overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#map.dragging { cursor: grabbing; }
#map.pointing { cursor: pointer; }

/* Cartouche: the survey title block. */
.cartouche {
  position: absolute; top: 16px; left: 16px; max-width: min(420px, calc(100% - 32px));
  background: var(--panel); border: 1px solid var(--rule);
  padding: 14px 16px 12px; display: grid; gap: 6px; pointer-events: none;
}
.cartouche h1 {
  margin: 0; font: 600 22px/1.1 var(--f-map); letter-spacing: 0.06em; text-wrap: balance;
}
.cartouche p { margin: 0; font: italic 400 14px/1.4 var(--f-serif); color: var(--ink-2); }
.cartouche .sources {
  font: 400 10.5px/1.5 var(--f-mono); letter-spacing: 0.02em; color: var(--ink-3);
  border-top: 1px solid var(--rule); padding-top: 6px;
}

/* Search. */
.cartouche { max-width: min(360px, calc(100% - 32px)); }
.panel-search {
  position: sticky; top: 0; z-index: 3; background: var(--paper); padding: 14px 20px 10px;
  border-bottom: 1px solid var(--rule); display: grid; gap: 6px;
}
.search { position: relative; }
.search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
.search input {
  width: 100%; padding: 9px 12px 9px 34px; border: 1px solid var(--rule); background: var(--sea);
  font-size: 14px; border-radius: 999px;
}
.search input:focus { border-color: var(--ink-3); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.search ul {
  position: absolute; left: 0; right: 0; top: calc(100% + 6px); max-height: 60vh; overflow: auto;
  margin: 0; padding: 4px 0; list-style: none; background: var(--paper); border: 1px solid var(--rule); z-index: 5;
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.18);
}
.search li { padding: 7px 12px; cursor: pointer; display: grid; grid-template-columns: 14px 1fr; gap: 10px; align-items: baseline; }
.follow-note { margin: 0; font-size: 11.5px; color: var(--ink-3); }
.search li[aria-selected="true"], .search li:hover { background: var(--sea); }
.search li small { display: block; color: var(--ink-3); font-size: 11.5px; }

/* Key (legend) and zoom. */
.key {
  position: absolute; left: 16px; bottom: 16px; background: var(--panel); border: 1px solid var(--rule);
  padding: 10px 12px; display: grid; gap: 8px; max-width: calc(100% - 120px);
}
.key h2 { margin: 0; font: 600 11px/1 var(--f-map); letter-spacing: 0.14em; color: var(--ink-2); }
.key .chips { display: flex; flex-wrap: wrap; gap: 4px 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); background: none;
  padding: 3px 8px 3px 6px; font-size: 12px; cursor: pointer; border-radius: 999px;
}
.chip[aria-pressed="false"] { opacity: 0.4; }
.chip i, .swatch { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.ramp { display: grid; gap: 4px; font: 400 11px/1 var(--f-mono); color: var(--ink-3); }
.ramp .bar { height: 8px; width: 220px; max-width: 100%; }
.ramp .ends { display: flex; justify-content: space-between; }
.key .note { font: italic 12px/1.35 var(--f-serif); color: var(--ink-3); max-width: 300px; }
.key .glyphs { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); }
.key .glyphs span { display: inline-flex; align-items: center; gap: 6px; }
.g-ghost { width: 9px; height: 9px; border: 1.2px dashed var(--ghost); border-radius: 50%; }
.g-plan { width: 8px; height: 8px; border: 1.5px solid var(--ink-2); border-radius: 50%; }
.g-realm { width: 8px; height: 8px; background: var(--ink); transform: rotate(45deg); }

.zoom { position: absolute; right: 16px; bottom: 16px; display: grid; background: var(--panel); border: 1px solid var(--rule); }
.zoom button { width: 34px; height: 32px; border: 0; background: none; cursor: pointer; font: 500 16px/1 var(--f-ui); }
.zoom button + button { border-top: 1px solid var(--rule); }

.tip {
  position: absolute; pointer-events: none; background: var(--paper); border: 1px solid var(--rule);
  padding: 7px 10px; max-width: 260px; display: grid; gap: 2px; z-index: 4;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
}
.tip b { font: 600 13px/1.25 var(--f-ui); }
.tip span { font-size: 12px; color: var(--ink-2); }

/* Ledger panel. */
.panel {
  background: var(--paper); border-left: 1px solid var(--rule); overflow: auto; min-width: 0;
  display: flex; flex-direction: column;
}
.panel-inner { padding: 18px 20px 28px; display: grid; gap: 18px; align-content: start; }
.crumb { display: flex; gap: 8px; align-items: center; font: 500 11px/1 var(--f-ui); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.crumb button { border: 0; background: none; padding: 0; cursor: pointer; color: var(--accent); font: inherit; letter-spacing: inherit; text-transform: inherit; }
.panel h2 { margin: 0; font: 600 24px/1.15 var(--f-map); letter-spacing: 0.04em; text-wrap: balance; }
.panel h3 {
  margin: 0; font: 600 11px/1 var(--f-ui); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3);
  padding-bottom: 6px; border-bottom: 1px solid var(--rule);
}
.lede { margin: 0; font: italic 15px/1.45 var(--f-serif); color: var(--ink-2); }
.section { display: grid; gap: 10px; }

.figures { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.figure b { display: block; font: 500 24px/1 var(--f-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.figure span { font-size: 12px; color: var(--ink-2); line-height: 1.3; display: block; margin-top: 4px; }

.mixbar { display: flex; height: 6px; width: 100%; background: var(--rule); overflow: hidden; }
.mixbar i { display: block; height: 100%; }

.rows { display: grid; gap: 2px; }
.row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center;
  padding: 7px 8px; margin: 0 -8px; border: 0; background: none; text-align: left; cursor: pointer;
}
.row:hover { background: var(--sea); }
.row .name { font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.row .meta { font: 400 12px/1 var(--f-mono); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.row .mixbar { grid-column: 1 / -1; height: 4px; }
.row .sub { grid-column: 1 / -1; font-size: 12px; color: var(--ink-3); margin-top: -2px; }

.meter { display: grid; gap: 6px; }
.meter .track { height: 8px; background: var(--rule); position: relative; }
.meter .fill { position: absolute; inset: 0 auto 0 0; background: var(--ink-2); }
.meter .lbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-2); }
.meter .lbl b { font: 500 12px/1 var(--f-mono); color: var(--ink); }

.mediachips { display: flex; flex-wrap: wrap; gap: 6px; }
.mediachips span { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); }

.works { display: grid; gap: 0; }
.work {
  display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 2px 10px; align-items: baseline;
  padding: 6px 8px; margin: 0 -8px; border: 0; background: none; text-align: left; cursor: pointer;
}
.work:hover { background: var(--sea); }
.work .t { min-width: 0; overflow-wrap: anywhere; }
.work .t small { display: block; color: var(--ink-3); font-size: 12px; }
.work .score { font: 500 12px/1 var(--f-mono); font-variant-numeric: tabular-nums; color: var(--ink-2); }
.work.plan .t { color: var(--ink-3); font-style: italic; }
.ghostlist { display: grid; gap: 6px; padding: 0; margin: 0; list-style: none; }
.ghostlist li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; color: var(--ink-2); }
.ghostlist li i { width: 9px; height: 9px; border: 1.2px dashed var(--ghost); border-radius: 50%; }
.ghostlist li span { font: italic 14px/1.35 var(--f-serif); }
.ghostlist li small { font: 400 11.5px/1 var(--f-mono); color: var(--ink-3); }
.more { border: 0; background: none; padding: 4px 0; color: var(--accent); cursor: pointer; justify-self: start; font-size: 12.5px; }

.lineage { width: 100%; height: 84px; display: block; overflow: visible; }
.lineage text { font: 400 10px var(--f-mono); fill: var(--ink-3); }
.lineage .axis { stroke: var(--rule); }
.lineage-cap { font-size: 12px; color: var(--ink-3); min-height: 18px; }

.card { display: grid; gap: 12px; }
.card .band { height: 4px; }
.card .kind { font: 500 11px/1 var(--f-ui); letter-spacing: 0.12em; text-transform: uppercase; }
.card dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 16px; margin: 0; }
.card dt { color: var(--ink-3); font-size: 12.5px; }
.card dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.stars { font-size: 15px; letter-spacing: 1px; color: var(--accent); }
.score10 { font: 500 16px/1 var(--f-mono); color: var(--accent); }
.score10 em { font: 400 12px var(--f-mono); color: var(--ink-3); font-style: normal; }
.card dd.stack { display: grid; gap: 4px; justify-items: start; }
.stars em { font: 400 12px var(--f-mono); color: var(--ink-3); font-style: normal; margin-left: 6px; letter-spacing: 0; }
.ext { color: var(--accent); font-weight: 500; text-decoration: none; }
.ext:hover { text-decoration: underline; }
.linkish { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-align: left; font-weight: 500; }

/* Works drawn as their objects on small canvases (same renderer as the map). */
.objc { display: block; flex: none; max-width: 100%; height: auto; }
.thumb .objc { max-width: 40px; max-height: 50px; width: auto !important; height: auto !important; }
.card-stage {
  display: grid; place-items: center; padding: 18px 8px 10px; margin: 0 -20px;
  background: radial-gradient(ellipse at 50% 62%, var(--sea) 0%, var(--paper) 72%);
}
.card-stage .objc { max-width: min(100%, 300px); transition: transform 0.35s cubic-bezier(0.2, 0.7, 0.2, 1); will-change: transform; }

/* Lineage timeline. */
.timeline { display: grid; gap: 6px; margin: 0 -20px; }
.tl-scroll { overflow-x: auto; overflow-y: hidden; padding: 0 20px 4px; scrollbar-width: thin; }
.tl-track { position: relative; }
.tl-decade { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--rule); }
.tl-decade.alt { background: color-mix(in srgb, var(--sea) 55%, transparent); }
.tl-decade span { position: absolute; bottom: 6px; left: 6px; font: 500 11px/1 var(--f-mono); color: var(--ink-3); }
.tl-work, .tl-ghost {
  position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 2px;
  height: 86px; padding: 0; border: 0; background: none;
}
.tl-work { cursor: pointer; transition: transform 0.15s ease; }
.tl-work:hover { transform: translateY(-3px); z-index: 2; }
.tl-work small, .tl-ghost small { font: 400 10px/1 var(--f-mono); color: var(--ink-3); }
.tl-ghost .slot {
  width: 40px; height: 58px; border: 1.3px dashed var(--ghost); border-radius: 3px; display: flex; align-items: center;
  justify-content: center; overflow: hidden; padding: 2px; background: color-mix(in srgb, var(--ghost) 8%, transparent);
}
.tl-ghost .slot i { font: italic 9px/1.15 var(--f-serif); color: var(--ghost); text-align: center; overflow: hidden; max-height: 100%; }
.timeline .lineage-cap { padding: 0 20px; }

/* Length distribution. */
.rug { width: 100%; height: auto; display: block; overflow: visible; }
.rug .base { stroke: var(--rule); }
.rug .mark { stroke: var(--accent); stroke-width: 2.5; }
.rug .mark-dot { fill: var(--accent); }
.rug text { font: 400 10.5px var(--f-mono); fill: var(--ink-3); }
.rug .mark-label { fill: var(--accent); font-weight: 500; }

/* Route stops. */
.stops { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.stop {
  display: grid; grid-template-columns: 22px 52px minmax(0, 1fr); gap: 10px; align-items: center; width: 100%;
  padding: 6px 8px; margin: 0 -8px; border: 0; background: none; text-align: left; cursor: pointer;
}
.stop:hover { background: var(--sea); }
.stop .num { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--paper); display: grid; place-items: center; font: 600 11px/1 var(--f-ui); }
.stop .objc { justify-self: center; max-height: 64px; width: auto !important; height: auto !important; max-width: 52px; }
.stop .t { min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
.stop .t small { display: block; font-weight: 400; color: var(--ink-3); font-size: 12px; }

.glyph { display: inline-flex; flex: none; line-height: 0; }
.work { grid-template-columns: 30px minmax(0, 1fr) auto; align-items: center; }
.thumb { width: 30px; display: flex; justify-content: center; align-items: flex-end; position: relative; }
.thumb .glyph:last-child { position: absolute; right: -2px; bottom: -3px; background: var(--paper); border-radius: 50%; padding: 1px; }
.thumb .glyph:only-child { position: static; background: none; padding: 0; }
.g-size { display: inline-flex; align-items: center; gap: 2px; }
.g-size b { display: block; border-radius: 50%; background: var(--ink-2); }
.g-size b:nth-child(1) { width: 4px; height: 4px; }
.g-size b:nth-child(2) { width: 6px; height: 6px; }
.g-size b:nth-child(3) { width: 9px; height: 9px; box-shadow: 0 0 0 3px color-mix(in srgb, var(--ink-2) 25%, transparent); }
.card-head { display: grid; gap: 6px; }
.card-title { display: grid; gap: 6px; min-width: 0; }
.covergrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px 6px; align-items: end; }
.covbtn { border: 0; padding: 0; background: none; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: transform 0.15s ease; }
.covbtn:hover { transform: translateY(-2px); }
.covbtn:hover .objc { filter: drop-shadow(0 0 6px color-mix(in srgb, var(--accent) 70%, transparent)); }
.tip.has-cover { grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; }
.tip .tt { display: grid; gap: 2px; min-width: 0; }

.panel-toggle { display: none; }

@media (max-width: 1100px) {
  .cartouche { max-width: min(360px, calc(100% - 32px)); }
}
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  .panel { border-left: 0; border-top: 1px solid var(--rule); max-height: 46vh; transition: max-height 0.25s ease; }
  .app.sheet-closed .panel { max-height: 44px; overflow: hidden; }
  .panel-toggle {
    display: flex; justify-content: center; align-items: center; gap: 8px; padding: 10px; border: 0; background: var(--paper);
    border-bottom: 1px solid var(--rule); font: 500 12px/1 var(--f-ui); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2);
    position: sticky; top: 0; z-index: 2; cursor: pointer;
  }
  .cartouche { top: 12px; left: 12px; padding: 10px 12px; }
  .cartouche h1 { font-size: 18px; }
  .cartouche p { font-size: 13px; }
  .cartouche .sources { display: none; }
  .search input { width: 160px; }
  .key { left: 12px; bottom: 12px; padding: 8px 10px; }
  .key .note, .key .glyphs { display: none; }
  .zoom { right: 12px; bottom: 12px; }
  .figure b { font-size: 20px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>

<div class="app" id="app">
  <main class="stage" id="stage">
    <canvas id="map" aria-label="Map of works grouped into regions and continents by sensibility"></canvas>

    <header class="cartouche">
      <h1>Manu's Media Atlas</h1>
      <p id="subtitle">A survey of everything read, watched, played and heard, arranged by what it is.</p>
      <div class="sources">Surveyed from Letterboxd · Serializd · AniList · Goodreads · Backloggd · RateYourMusic, October 2026</div>
    </header>

    <section class="key" id="key" aria-label="Map key"></section>

    <div class="zoom">
      <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
      <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
      <button type="button" id="zoom-reset" aria-label="Show the whole map">⤢</button>
    </div>
    <div class="tip" id="tip" hidden></div>
  </main>

  <aside class="panel" id="panel" aria-live="polite">
    <button type="button" class="panel-toggle" id="panel-toggle" aria-expanded="true">Ledger</button>
    <div class="panel-search">
      <div class="search">
        <svg class="search-icon" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="Search works, creators, regions" autocomplete="off" aria-label="Search works, creators and regions" aria-controls="search-results">
        <ul id="search-results" role="listbox" hidden></ul>
      </div>
      <p class="follow-note" id="follow-note">The panel follows the map, showing whatever is in view.</p>
    </div>
    <div class="panel-inner" id="panel-inner"></div>
  </aside>

<script>// ---------- data ----------
const W = JSON.parse(document.getElementById('world').textContent);
const MEDIA = ['film', 'tv', 'anime', 'manga', 'comics', 'books', 'game', 'music'];
const MEDIA_LABEL = { film: 'Film', tv: 'TV', anime: 'Anime', manga: 'Manga', comics: 'Comics', books: 'Books', game: 'Games', music: 'Music' };
const STATUS_LABEL = { done: 'Finished', active: 'In progress', paused: 'Paused', dropped: 'Dropped', planned: 'Planned' };
const itemById = new Map(W.items.map(i => [i.id, i]));
const provById = new Map(W.provinces.map(p => [p.id, p]));
const contById = new Map(W.continents.map(c => [c.id, c]));
const isConsumed = i => i.st !== 'planned';
for (const p of W.provinces) {
  p.works = p.items.map(id => itemById.get(id));
  p.consumed = p.works.filter(isConsumed).length;
  p.unseen = p.canon.filter(g => !g.seen);
  p.seenCanon = p.canon.length - p.unseen.length;
  p.cross = Object.keys(p.media).length > 1;
}
for (const c of W.continents) {
  c.provs = W.provinces.filter(p => p.c === c.id);
  c.works = c.provs.flatMap(p => p.works);
  c.top = c.works.length ? Math.min(...c.works.map(w => w.py)) - (W.S || 7) * 2.3 : c.y - c.r;
  c.mix = {}; for (const w of c.works) if (w.st !== 'planned') c.mix[w.m] = (c.mix[w.m] || 0) + 1;
  c.mixTotal = Object.values(c.mix).reduce((a, b) => a + b, 0) || 1;
}
// Cover tiles: up to 8 x 8 cells of 108 x 160 px (albums use the top 108 x 108). Each tile holds the
// works of one patch of the map, so a zoomed-in view needs only the few tiles under it.
// Nothing is fetched up front: a tile is requested when its patch nears the view at cover zoom, or when
// the panel shows one of its works; it's decoded off the main thread before it is ever drawn, and tiles
// left unused for a while are let go (their works' rendered bitmaps stay cached separately).
// Higher-resolution covers (`hs` on a work: [file, cell]) sit in small packs of neighbours, 3 x 2 cells of
// 384 x 568, fetched only for works drawn wider than the tile cell on screen, and swapped in once decoded.
const SPR = { cols: 8, cw: 108, ch: 160 };
const HI = { cols: 3, cw: 384, ch: 568 };
// A pool of images fetched on demand, a few at a time, in the order last asked for.
function makePool(n, url, keep, idle) {
  const slots = Array.from({ length: n }, () => ({ im: null, ready: false, used: 0, waits: [] }));
  const queue = [];
  let loading = 0;
  const pump = () => {
    while (loading < 4 && queue.length) {
      const t = queue.shift();
      if (t.im) continue;
      const im = new Image();
      im.decoding = 'async'; if (t.isHi) im.__hi = true; t.im = im; loading++;
      im.src = url(slots.indexOf(t));
      im.decode().then(() => { t.ready = true; }, () => { t.im = null; t.failed = true; })
        .finally(() => { loading--; for (const f of t.waits.splice(0)) f(); if (typeof requestDraw === 'function') requestDraw(); pump(); });
    }
  };
  setInterval(() => {
    const live = slots.filter(t => t.ready).sort((a, b) => a.used - b.used), now = performance.now();
    for (const t of live.slice(0, Math.max(0, live.length - keep))) if (now - t.used > idle) { t.im.src = ''; t.im = null; t.ready = false; }
  }, 5e3);
  return {
    slots,
    // the decoded image for slot s, or null while it isn't ready (asking queues it unless `peek`)
    get(s, urgent, peek) {
      const t = slots[s];
      if (!t) return null;
      t.used = performance.now();
      if (t.ready) return t.im;
      if (!peek && !t.im && !t.failed && !queue.includes(t)) { urgent ? queue.unshift(t) : queue.push(t); pump(); }
      return null;
    },
    // calls f once slot s is ready (or has failed)
    when(s, f) { if (this.get(s, true)) return f(); if (slots[s].failed) return; slots[s].waits.push(f); },
    // replace the queue with these slots, in this order
    want(list) {
      const now = performance.now();
      for (const t of list) t.used = now;
      const fresh = list.filter(t => !t.im && !t.failed);
      if (!fresh.length) return;
      queue.length = 0; queue.push(...fresh); pump();
    },
  };
}
const sheetCount = Math.max(0, 1 + d3.max(W.items, i => (i.sp ? i.sp[0] : -1)));
const TILES = makePool(sheetCount, s => `tiles/t${s}.webp`, 14, 20e3);
const TILE = TILES.slots;
for (const t of TILE) Object.assign(t, { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity });
for (const i of W.items) if (i.sp) {
  const t = TILE[i.sp[0]], b = i.dl ? itemById.get(i.dl) : i;

}
const hiCount = 1 + (d3.max(W.items, i => (i.hs ? i.hs[0] : -1)) ?? -1);

// Each frame at (or just before) cover zoom: queue the tiles under and around the view, nearest first.
function wantTiles(vx0, vy0, vx1, vy1) {
  const mx = (vx1 - vx0) * 0.35, my = (vy1 - vy0) * 0.35, cx = (vx0 + vx1) / 2, cy = (vy0 + vy1) / 2;
  const want = [];
  for (const t of TILE) {
    if (t.x1 < vx0 - mx || t.x0 > vx1 + mx || t.y1 < vy0 - my || t.y0 > vy1 + my) continue;
    want.push([Math.hypot((t.x0 + t.x1) / 2 - cx, (t.y0 + t.y1) / 2 - cy), t]);

const HUE = { grim: 28, fantasy: 135, space: 232, crime: 300, horror: 168, heroes: 2, samurai: 58, war: 88, western: 42, heart: 342, surreal: 268, play: 108, action: 198, build: 150, classic: 72, sports: 15 };

// ---------- theme tokens ----------
let T = {};
function readTokens() {
  const cs = getComputedStyle(document.documentElement);
  const v = n => cs.getPropertyValue(n).trim();
  T = {
    sea: v('--sea'), seaLine: v('--sea-line'), paper: v('--paper'), ink: v('--ink'), ink2: v('--ink-2'), ink3: v('--ink-3'),
    rule: v('--rule'), contour: v('--contour'), border: v('--border'), accent: v('--accent'), ghost: v('--ghost'),
    landL: +v('--land-l') || 93, landC: +v('--land-c') || 15, dark: +v('--land-l') < 50,
    media: Object.fromEntries(MEDIA.map(m => [m, v('--m-' + m)])),
  };
}
const landColor = (cid, level) => {
  const step = level * (T.dark ? 2.3 : 2.1);
  return d3.hcl(HUE[cid], T.landC + level * 2.2, T.dark ? T.landL + step : T.landL - step).formatHex();
};

// Scaled with the spacing between works, so the coastline keeps the same character.

      g.fillRect(x + w * 0.1, oy + oh * 0.36, w * 0.56, oh * 0.13); g.fillRect(x + w * 0.1, oy + oh * 0.62, w * 0.36, oh * 0.1);
    }

  g.restore();
  rrPath(g, x, y, w, h, w * 0.025); g.strokeStyle = 'rgba(0,0,0,0.42)'; g.lineWidth = px * 0.7; g.stroke();
}

function drawComic(g, im, i, x, y, w, h, px, detail) {
  const d = lengthInfo(i).d * w, dx = d * DX, dy = d * DY;
  if (d > w * 0.05) { faces(g, x, y, w, h, dx, dy, '#f2eee5', '#fbf9f4'); if (detail) sideLines(g, x + w, y, h, dx, dy, 8, 'rgba(0,0,0,0.12)', px); }
  // the collector's bag, slightly larger than the issue, with its flap at the top

  rrPath(g, x - m, y - flap, w + 2 * m, h + flap + m, w * 0.025);
  g.fillStyle = 'rgba(235,240,245,0.16)'; g.fill();
  g.strokeStyle = 'rgba(255,255,255,0.45)'; g.lineWidth = px * 0.7; g.stroke();
  g.beginPath(); g.moveTo(x - m, y - flap * 0.4); g.lineTo(x + w + m, y - flap * 0.4); g.strokeStyle = 'rgba(255,255,255,0.3)'; g.stroke();
  paintArt(g, im, i, x, y, w, h);
  if (detail) { // the classic corner box

    g.fillStyle = '#fbfaf6'; g.fillRect(x + w * 0.04, y + h * 0.03, bw, bh);
    g.fillStyle = T.media.comics; g.fillRect(x + w * 0.04 + bw * 0.18, y + h * 0.03 + bh * 0.22, bw * 0.64, bh * 0.4);
  }
  g.save(); rrPath(g, x - m, y - flap, w + 2 * m, h + flap + m, w * 0.025); g.clip();
  sheen(g, x - m, y - flap, w + 2 * m, h + flap + m, 0.24);
  g.restore();
}

function drawAlbum(g, im, i, x, y, s, px, detail) {
  const R = s * 0.47, cx = x + s * 0.7, cy = y + s / 2;
  g.fillStyle = MAT.vinyl; g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.fill();
  if (g.createConicGradient) {
    const cg = g.createConicGradient(-0.5, cx, cy);
    for (const [t, a] of [[0, 0], [0.1, 0.16], [0.2, 0], [0.5, 0], [0.6, 0.12], [0.7, 0], [1, 0]]) cg.addColorStop(t, `rgba(255,255,255,${a})`);
    g.fillStyle = cg; g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.fill();
  }
  if (detail) {
    g.strokeStyle = 'rgba(255,255,255,0.07)'; g.lineWidth = px * 0.6;
    for (const f of [0.52, 0.64, 0.76, 0.88]) { g.beginPath(); g.arc(cx, cy, R * f, 0, Math.PI * 2); g.stroke(); }
  }
  g.fillStyle = '#e7dcc3'; g.beginPath(); g.arc(cx, cy, R * 0.33, 0, Math.PI * 2); g.fill();
  g.strokeStyle = T.media.music; g.lineWidth = Math.max(px * 0.8, R * 0.05); g.beginPath(); g.arc(cx, cy, R * 0.25, 0, Math.PI * 2); g.stroke();
  g.fillStyle = MAT.vinyl; g.beginPath(); g.arc(cx, cy, R * 0.04, 0, Math.PI * 2); g.fill();
  // the sleeve casts a shadow on the record
  const sg = g.createLinearGradient(x + s, 0, x + s + R * 0.3, 0);
  sg.addColorStop(0, 'rgba(0,0,0,0.55)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
  g.save(); g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.clip(); g.fillStyle = sg; g.fillRect(x + s, y, R * 0.3, s); g.restore();
  paintArt(g, im, i, x, y, s, s);
  sheen(g, x, y, s, s, 0.08);
  g.strokeStyle = 'rgba(0,0,0,0.5)'; g.lineWidth = px * 0.7; g.strokeRect(x, y, s, s);
  g.strokeStyle = 'rgba(255,255,255,0.14)'; g.strokeRect(x + px * 0.7, y + px * 0.7, s - px * 1.4, s - px * 1.4);
}

// TV and anime: a Blu-ray case. Translucent blue plastic with a moulded hinge, the insert's "Blu-ray Disc"
// banner across the top, the cover under a clear glossy sleeve. Flat, like the game cases: no length.
const BD = { hdr: 0.092, side: 0.034, hinge: 0.058 };
function bdMargins(w, h) { const m = w * BD.side; return { l: w * BD.hinge, r: m, t: h * BD.hdr + m * 0.9, b: m }; }
function bdLogo(g, cx, cy, s) {
  // the disc emblem: a silver disc with a centre hole
  const R = s * 0.42, dx = cx - s * 1.55;
  const dg = g.createRadialGradient(dx - R * 0.3, cy - R * 0.4, R * 0.1, dx, cy, R);
  dg.addColorStop(0, '#ffffff'); dg.addColorStop(0.6, '#c9d7ee'); dg.addColorStop(1, '#8fa6cc');
  g.fillStyle = dg; g.beginPath(); g.arc(dx, cy, R, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#1a4fbf'; g.beginPath(); g.arc(dx, cy, R * 0.22, 0, Math.PI * 2); g.fill();
  // the wordmark, silver on blue
  const tg = g.createLinearGradient(0, cy - s * 0.5, 0, cy + s * 0.5);
  tg.addColorStop(0, '#ffffff'); tg.addColorStop(0.55, '#e3ebf7'); tg.addColorStop(1, '#a9bddc');
  g.fillStyle = tg; g.textBaseline = 'middle'; g.textAlign = 'left';
  g.font = `italic 700 ${s}px Archivo, Arial, sans-serif`;
  const x0 = dx + R * 1.5; g.fillText('Blu-ray', x0, cy + s * 0.04);
  const tw = g.measureText('Blu-ray').width;
  g.font = `600 ${s * 0.42}px Archivo, Arial, sans-serif`; g.fillText('DISC', x0 + tw + s * 0.14, cy + s * 0.16);
}
function drawBluray(g, im, i, x, y, w, h, px, detail) {
  const M = bdMargins(w, h), X = x - M.l, Y = y - M.t, Wd = w + M.l + M.r, Ht = h + M.t + M.b, r = w * 0.055;
  const hh = h * BD.hdr, hy = y - hh;
  // the case: blue plastic, darker through the hinge, lit a little from above
  rrPath(g, X, Y, Wd, Ht, r);
  const cg = g.createLinearGradient(X, 0, X + Wd, 0);
  cg.addColorStop(0, '#0f347c'); cg.addColorStop(M.l / Wd, '#1846a6'); cg.addColorStop(M.l / Wd + 0.02, '#1f55c4'); cg.addColorStop(1, '#1a4bb0');
  g.fillStyle = cg; g.fill();
  const vg = g.createLinearGradient(0, Y, 0, Y + Ht);
  vg.addColorStop(0, 'rgba(255,255,255,0.12)'); vg.addColorStop(0.3, 'rgba(255,255,255,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.12)');
  g.fillStyle = vg; g.fill();
  // moulded hinge: a groove with a lit edge beside it
  const lw = Math.max(px * 0.6, w * 0.007), gx = X + M.l * 0.55;
  g.lineWidth = lw;
  g.strokeStyle = 'rgba(0,10,40,0.45)'; g.beginPath(); g.moveTo(gx, Y + r * 0.6); g.lineTo(gx, Y + Ht - r * 0.6); g.stroke();
  g.strokeStyle = 'rgba(170,205,255,0.35)'; g.beginPath(); g.moveTo(gx + lw, Y + r * 0.6); g.lineTo(gx + lw, Y + Ht - r * 0.6); g.stroke();
  // the insert: banner, then the cover
  const bg = g.createLinearGradient(0, hy, 0, y);
  bg.addColorStop(0, '#3a80ee'); bg.addColorStop(0.5, '#1d5ad0'); bg.addColorStop(1, '#0f3e9f');
  g.fillStyle = bg; g.fillRect(x, hy, w, hh);
  const rule = Math.max(px * 0.5, hh * 0.05);
  g.fillStyle = 'rgba(255,255,255,0.3)'; g.fillRect(x, hy, w, rule);
  g.fillStyle = 'rgba(160,200,255,0.7)'; g.fillRect(x, y - rule, w, rule);
  if (hh / px > 8) bdLogo(g, x + w * 0.5 + hh * 0.2, hy + hh * 0.5, hh * 0.56);
  else { // too small to letter: a disc and a bar stand in for the logo
    g.fillStyle = 'rgba(235,242,255,0.95)';
    g.beginPath(); g.arc(x + w * 0.3, hy + hh / 2, hh * 0.22, 0, Math.PI * 2); g.fill();
    rrPath(g, x + w * 0.38, hy + hh * 0.33, w * 0.34, hh * 0.34, hh * 0.17); g.fill();
  }
  paintArt(g, im, i, x, y, w, h);
  // where the insert meets the plastic
  g.strokeStyle = 'rgba(5,20,60,0.55)'; g.lineWidth = px * 0.7; g.strokeRect(x, hy, w, h + hh);
  // the clear sleeve: a broad glare from the top left and a thin second streak
  g.save(); rrPath(g, X, Y, Wd, Ht, r); g.clip();
  const gl = g.createLinearGradient(X, Y, X + Wd * 0.85, Y + Ht * 0.55);
  gl.addColorStop(0, 'rgba(255,255,255,0.2)'); gl.addColorStop(0.36, 'rgba(255,255,255,0.05)'); gl.addColorStop(0.37, 'rgba(255,255,255,0)');
  gl.addColorStop(0.6, 'rgba(255,255,255,0)'); gl.addColorStop(0.62, 'rgba(255,255,255,0.06)'); gl.addColorStop(0.68, 'rgba(255,255,255,0)');
  g.fillStyle = gl; g.fillRect(X, Y, Wd, Ht); g.restore();
  // rim: a lit outer edge and a dark inner line
  rrPath(g, X, Y, Wd, Ht, r); g.strokeStyle = 'rgba(165,200,255,0.6)'; g.lineWidth = px * 0.9; g.stroke();
  rrPath(g, X + px * 0.9, Y + px * 0.9, Wd - px * 1.8, Ht - px * 1.8, r); g.strokeStyle = 'rgba(0,15,50,0.35)'; g.lineWidth = px * 0.6; g.stroke();
}

// Lighten (amt > 0) or darken (amt < 0) a hex colour.
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16), t = amt < 0 ? 0 : 255, p = Math.abs(amt);
  const c = s => Math.round(((n >> s) & 255) + (t - ((n >> s) & 255)) * p);
  return `rgb(${c(16)},${c(8)},${c(0)})`;
}

// Little platform marks printed beside the logo.
function pkgMark(g, mark, x, y, s, lc) {
  switch (mark) {
    case 'win': { // the four-colour window
      const q = s * 0.46, gp = s * 0.08, cols = ['#f25022', '#7fba00', '#00a4ef', '#ffb900'];
      cols.forEach((c, k) => { g.fillStyle = c; g.fillRect(x + (k % 2) * (q + gp), y - s / 2 + Math.floor(k / 2) * (q + gp), q, q); });
      return s * 1.15;
    }
    case 'orb': { // a green sphere with an X
      const R = s * 0.5; g.fillStyle = '#5db53a'; g.beginPath(); g.arc(x + R, y, R, 0, Math.PI * 2); g.fill();
      g.strokeStyle = '#fff'; g.lineWidth = R * 0.32; g.beginPath(); g.moveTo(x + R * 0.45, y - R * 0.55); g.lineTo(x + R * 1.55, y + R * 0.55); g.moveTo(x + R * 1.55, y - R * 0.55); g.lineTo(x + R * 0.45, y + R * 0.55); g.stroke();
      return s * 1.2;
    }
    case 'cube': { // an isometric cube
      const R = s * 0.52, cx = x + R, cy = y;
      g.fillStyle = '#6a52c4'; g.beginPath(); g.moveTo(cx, cy - R); g.lineTo(cx + R * 0.87, cy - R / 2); g.lineTo(cx + R * 0.87, cy + R / 2); g.lineTo(cx, cy + R); g.lineTo(cx - R * 0.87, cy + R / 2); g.lineTo(cx - R * 0.87, cy - R / 2); g.closePath(); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.35)'; g.beginPath(); g.moveTo(cx, cy - R); g.lineTo(cx + R * 0.87, cy - R / 2); g.lineTo(cx, cy); g.lineTo(cx - R * 0.87, cy - R / 2); g.closePath(); g.fill();
      return s * 1.2;
    }
    case 'joy': { // two Joy-Con halves
      const w2 = s * 0.42, hh = s * 1.0;
      rrPath(g, x, y - hh / 2, w2, hh, w2 * 0.5); g.fillStyle = lc; g.fill();
      rrPath(g, x + w2 + s * 0.08, y - hh / 2, w2, hh, w2 * 0.5); g.strokeStyle = lc; g.lineWidth = s * 0.12; g.stroke();
      return s * 1.15;
    }
    case 'vr': { // a headset
      rrPath(g, x, y - s * 0.32, s * 1.2, s * 0.64, s * 0.22); g.fillStyle = lc; g.fill();
      g.fillStyle = '#30343d'; g.beginPath(); g.arc(x + s * 0.35, y, s * 0.16, 0, Math.PI * 2); g.arc(x + s * 0.85, y, s * 0.16, 0, Math.PI * 2); g.fill();
      return s * 1.45;
    }
  }
  return 0;
}

// A keep case (DVD/Blu-ray-style) with the console's printed header band.
function drawKeepCase(g, im, i, x, y, w, h, px, detail, P) {
  const M = gameMargins(i, w, h), X = x - M.l, Y = y - M.t, Wd = w + M.l + M.r, Ht = h + M.t + M.b, r = w * 0.05;
  const hh = P.hdr ? h * HDR : 0, hy = y - hh;
  rrPath(g, X, Y, Wd, Ht, r);
  const bg = g.createLinearGradient(X, 0, X + Wd, 0);
  bg.addColorStop(0, shade(P.plastic, -0.35)); bg.addColorStop(0.1, P.plastic); bg.addColorStop(0.9, P.plastic); bg.addColorStop(1, shade(P.plastic, -0.2));
  g.fillStyle = bg; g.fill();
  // the hinge: two moulded ridges down the spine
  g.strokeStyle = P.light ? 'rgba(0,0,0,0.13)' : 'rgba(255,255,255,0.13)'; g.lineWidth = Math.max(px * 0.6, w * 0.008);
  g.beginPath(); for (const f of [0.32, 0.62]) { g.moveTo(X + M.l * f, Y + r); g.lineTo(X + M.l * f, Y + Ht - r); } g.stroke();
  // the printed insert: header band, then the art
  if (P.hdr) {
    const hg = g.createLinearGradient(0, hy, 0, y); hg.addColorStop(0, P.hdr[0]); hg.addColorStop(1, P.hdr[1]);
    g.fillStyle = hg; g.fillRect(x, hy, w, hh);
    if (P.rule) { g.fillStyle = P.rule; g.fillRect(x, y - Math.max(px * 0.8, hh * 0.07), w, Math.max(px * 0.8, hh * 0.07)); }
    const s = hh * 0.56, cy = hy + hh / 2;
    let lx = x + w * 0.06;
    if (hh / px > 7) {
      if (P.mark) lx += pkgMark(g, P.mark, lx, cy, s, P.lc) + s * 0.25;
      g.fillStyle = P.lc; g.textBaseline = 'middle'; g.textAlign = 'left';
      const long = P.logo.length > 6;
      g.font = `${P.ital ? 'italic ' : ''}800 ${long ? s * 0.62 : s * 0.95}px Archivo, Arial, sans-serif`;
      if (long) { try { g.letterSpacing = `${s * 0.06}px`; } catch {} }
      g.fillText(P.logo, lx, cy + s * 0.04);
      if (long) { try { g.letterSpacing = '0px'; } catch {} }
    } else {
      // too small to letter: a bar in the logo colour stands in for it
      rrPath(g, lx, cy - s * 0.3, w * (P.logo.length > 6 ? 0.5 : 0.24), s * 0.6, s * 0.3); g.fillStyle = P.lc; g.fill();
    }
  }
  paintArt(g, im, i, x, y, w, h);
  g.strokeStyle = 'rgba(0,0,0,0.4)'; g.lineWidth = px * 0.6; g.strokeRect(x, hy, w, h + hh);
  // clear plastic sleeve over the insert, and the rim of the case
  g.save(); rrPath(g, X, Y, Wd, Ht, r); g.clip(); sheen(g, X, Y, Wd, Ht, P.light ? 0.1 : 0.15); g.restore();
  rrPath(g, X, Y, Wd, Ht, r); g.strokeStyle = P.light ? 'rgba(0,0,0,0.22)' : 'rgba(255,255,255,0.2)'; g.lineWidth = px * 0.8; g.stroke();
}

// A CD jewel case: black tray, hinge knuckles on the left, the insert's spine band, very glossy lid.
function drawJewel(g, im, i, x, y, w, h, px, detail, P) {
  const M = gameMargins(i, w, h), X = x - M.l, Y = y - M.t, Wd = w + M.l + M.r, Ht = h + M.t + M.b, r = w * 0.02;
  const hinge = w * 0.07, bw = w * 0.13, bx = x - bw;
  rrPath(g, X, Y, Wd, Ht, r); g.fillStyle = '#0c0d0f'; g.fill();
  // the band printed down the insert's left edge
  g.fillStyle = P.band; g.fillRect(bx, y, bw, h);
  const dark = P.band === '#0b0b0c';
  if (P.mark === 'ps') {
    // the four-colour PS emblem, then the wordmark running down the band
    const s = bw * 0.62, ex = bx + (bw - s) / 2, ey = y + bw * 0.25;
    g.fillStyle = '#e03a3e'; g.fillRect(ex + s * 0.3, ey, s * 0.28, s * 0.62);
    g.fillStyle = '#f5c400'; g.fillRect(ex, ey + s * 0.66, s, s * 0.11);
    g.fillStyle = '#0aa65b'; g.fillRect(ex, ey + s * 0.78, s, s * 0.11);
    g.fillStyle = '#2a6fdb'; g.fillRect(ex, ey + s * 0.9, s, s * 0.11);
    if (bw / px > 8) {
      g.save(); g.translate(bx + bw * 0.5, y + bw * 1.25); g.rotate(Math.PI / 2);
      g.fillStyle = '#f2f2f2'; g.font = `700 ${bw * 0.48}px Archivo, Arial, sans-serif`; g.textBaseline = 'middle'; g.textAlign = 'left';
      g.fillText('PlayStation', 0, 0); g.restore();
    } else { g.fillStyle = 'rgba(240,240,240,0.8)'; g.fillRect(bx + bw * 0.4, y + bw * 1.3, bw * 0.2, h * 0.4); }
  } else if (P.mark === 'swirl') {
    const R = bw * 0.3, cx = bx + bw / 2, cy = y + bw * 0.6;
    g.strokeStyle = '#ef6c1a'; g.lineWidth = R * 0.35; g.beginPath();
    for (let a = 0; a < Math.PI * 3.2; a += 0.2) { const rr = R * (0.15 + a / (Math.PI * 3.2) * 0.85); a ? g.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr) : g.moveTo(cx + rr, cy); }
    g.stroke();
  }
  g.fillStyle = dark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.08)'; g.fillRect(x - px * 0.6, y, px * 0.6, h);
  paintArt(g, im, i, x, y, w, h);
  // hinge: clear plastic over the tray, with knuckles at top and bottom
  const hx = X;
  g.fillStyle = 'rgba(255,255,255,0.07)'; g.fillRect(hx, Y, hinge, Ht);
  g.fillStyle = 'rgba(255,255,255,0.22)';
  for (const ky of [Y + Ht * 0.02, Y + Ht * 0.86]) rrPath(g, hx + hinge * 0.15, ky, hinge * 0.7, Ht * 0.12, hinge * 0.3), g.fill();
  g.strokeStyle = 'rgba(255,255,255,0.35)'; g.lineWidth = px * 0.7;
  g.beginPath(); g.moveTo(hx + hinge, Y); g.lineTo(hx + hinge, Y + Ht); g.stroke();
  // the glossy lid: a broad diagonal glare and crisp edges
  g.save(); rrPath(g, X, Y, Wd, Ht, r); g.clip();
  const gl = g.createLinearGradient(X, Y, X + Wd, Y + Ht);
  gl.addColorStop(0, 'rgba(255,255,255,0.26)'); gl.addColorStop(0.3, 'rgba(255,255,255,0.06)'); gl.addColorStop(0.31, 'rgba(255,255,255,0)');
  gl.addColorStop(0.62, 'rgba(255,255,255,0)'); gl.addColorStop(0.63, 'rgba(255,255,255,0.07)'); gl.addColorStop(0.72, 'rgba(255,255,255,0)');
  g.fillStyle = gl; g.fillRect(X, Y, Wd, Ht); g.restore();
  rrPath(g, X, Y, Wd, Ht, r); g.strokeStyle = 'rgba(255,255,255,0.55)'; g.lineWidth = px * 0.9; g.stroke();
  rrPath(g, X + px, Y + px, Wd - 2 * px, Ht - 2 * px, r); g.strokeStyle = 'rgba(0,0,0,0.5)'; g.lineWidth = px * 0.6; g.stroke();
}

// Cartridges: the cover becomes the label, set into each console's own shell.
const CART = { m: 0.075, top: 0.18, bot: 0.1, notch: 0.16 };
function cartPath(g, X, Y, W, H, r, notch) {
  g.beginPath(); g.moveTo(X + r, Y); g.lineTo(X + W - notch, Y); g.lineTo(X + W, Y + notch);
  g.lineTo(X + W, Y + H - r * 1.8); g.arcTo(X + W, Y + H, X + W - r * 1.8, Y + H, r * 1.8);
  g.lineTo(X + r * 1.8, Y + H); g.arcTo(X, Y + H, X, Y + H - r * 1.8, r * 1.8);
  g.lineTo(X, Y + r); g.arcTo(X, Y, X + r, Y, r); g.closePath();
}
function cartShell(g, P, X, Y, Wd, Ht, w, h) {
  const r = w * 0.05;
  switch (P.shape) {
    case 'snes': { // rounded shoulders, with grip notches cut into the lower sides
      const R = w * 0.22, nY = Y + Ht * 0.7, nH = Ht * 0.16, nD = Wd * 0.05;
      g.beginPath(); g.moveTo(X + R, Y); g.lineTo(X + Wd - R, Y); g.arcTo(X + Wd, Y, X + Wd, Y + R, R);
      g.lineTo(X + Wd, nY); g.lineTo(X + Wd - nD, nY + nH * 0.2); g.lineTo(X + Wd - nD, nY + nH * 0.8); g.lineTo(X + Wd, nY + nH);

// The region's history as a timeline: every work you have in release order, as its object, with the
// landmarks you have not reached sitting in dashed slots between them. Scrolls sideways when busy.
function lineage(p) {
  const marks = [
    ...p.works.filter(w => w.y && !w.dl).map(w => ({ y: w.y, w })),
    ...p.unseen.filter(g => g.y).map(g => ({ y: g.y, g })),
  ].sort((a, b) => a.y - b.y || (a.g ? 1 : 0) - (b.g ? 1 : 0));
  if (marks.length < 3) return null;
  const SLOT = 60, LANE = 92, AXIS = 30, LANES = 3;
  const [y0, y1] = d3.extent(marks, m => m.y);
  const visible = Math.max(280, (panelInner.clientWidth || 340) - 4);
  const width = Math.max(visible, Math.min(5200, Math.max((y1 - y0) * 9, marks.length * SLOT / LANES * 1.25) + SLOT * 2));
  const x = d3.scaleLinear().domain([y0 - 0.5, y1 + 0.5]).range([SLOT * 0.6, width - SLOT * 0.6]);
  // place each mark in the lowest lane where it fits, pushing right when all lanes are busy
  const lanes = Array(LANES).fill(-Infinity);
  for (const m of marks) {
    let cx = x(m.y), lane = lanes.findIndex(r => cx - SLOT / 2 >= r + 4);
    if (lane < 0) { lane = lanes.indexOf(Math.min(...lanes)); cx = lanes[lane] + 4 + SLOT / 2; }
    lanes[lane] = cx + SLOT / 2; m.cx = cx; m.lane = lane;
  }
  const W2 = Math.max(width, ...lanes.map(r => r + SLOT * 0.5));
  const height = LANES * LANE + AXIS;
  const cap = h('div', { class: 'lineage-cap' }, 'Release order, oldest on the left. Dashed slots are landmarks not yet reached.');
  const track = h('div', { class: 'tl-track', style: `width:${W2}px;height:${height}px` });
  // decade bands and labels
  for (let d = Math.floor(y0 / 10) * 10; d <= y1; d += 10) {
    const a = Math.max(0, x(d - 0.5)), b = Math.min(W2, x(d + 9.5));
    track.append(h('div', { class: 'tl-decade' + ((d / 10) % 2 ? ' alt' : ''), style: `left:${a}px;width:${Math.max(0, b - a)}px` },
      h('span', null, `${d}s`)));
  }
  for (const m of marks) {
    const top = height - AXIS - (m.lane + 1) * LANE + 6;
    const label = m.w ? `${m.y} · ${m.w.t} · ${MEDIA_LABEL[m.w.m]}` : `${m.y} · ${m.g.t}${m.g.by ? ' · ' + m.g.by : ''} (not reached yet)`;
    const node = m.w
      ? h('button', { type: 'button', class: 'tl-work', title: label, 'aria-label': label, style: `left:${m.cx - SLOT / 2}px;top:${top}px;width:${SLOT}px`, onclick: () => selectItem(m.w.id) },
          coverEl(m.w, m.w.sp && m.w.sp[2] ? 40 : 36) || glyphEl(m.w.m, 18), h('small', null, m.y))
      : h('div', { class: 'tl-ghost', title: label, style: `left:${m.cx - SLOT / 2}px;top:${top}px;width:${SLOT}px` },
          h('span', { class: 'slot' }, h('i', null, m.g.t)), h('small', null, m.y));
    node.addEventListener('mouseenter', () => { cap.textContent = label; });
    track.append(node);
  }
  const scroller = h('div', { class: 'tl-scroll', role: 'group', 'aria-label': `Timeline of ${p.name}` }, track);
  return h('div', { class: 'timeline' }, scroller, cap);
}

// Where this work's length sits among everything of its medium you have: a distribution with a marker.
const LEN_NOUN = { books: 'books', comics: 'comics', manga: 'manga series', anime: 'anime', tv: 'shows', game: 'games' };
const lenShort = (m, n) => m === 'game' ? `${nf(Math.round(n))} h` : m === 'anime' ? `${Math.max(1, Math.round(n / 60))} h` : m === 'tv' ? `${nf(n)} ep` : m === 'manga' ? `${nf(n)} ch` : `${nf(n)} p`;
function lengthRug(i) {
  const min = (i.m === 'books' || i.m === 'comics') ? 20 : 0;
  if (!LEN_NOUN[i.m] || !(i.len > min)) return null;
  const pool = W.items.filter(x => x.m === i.m && x.len > min);
  if (pool.length < 6) return null;
  const width = Math.max(280, (panelInner.clientWidth || 340) - 4), height = 86;
  const ext = d3.extent(pool, x => x.len);
  if (ext[0] === ext[1]) return null;
  const xs = d3.scaleLog().domain(ext).range([14, width - 14]).clamp(true);
  const edges = d3.range(31).map(k => ext[0] * Math.pow(ext[1] / ext[0], k / 30));
  const bins = d3.bin().domain(ext).thresholds(edges.slice(1, -1))(pool.map(x => x.len));
  const ymax = d3.max(bins, b => b.length) || 1;
  const svg = d3.create('svg').attr('class', 'rug').attr('viewBox', `0 0 ${width} ${height}`).attr('role', 'img')
    .attr('aria-label', `Length compared with the other ${LEN_NOUN[i.m]} on the map`);
  svg.append('line').attr('class', 'base').attr('x1', 14).attr('x2', width - 14).attr('y1', 58).attr('y2', 58);
  svg.selectAll('rect').data(bins).join('rect')
    .attr('x', b => xs(b.x0) + 0.5).attr('width', b => Math.max(1, xs(b.x1) - xs(b.x0) - 1.5))
    .attr('y', b => 58 - (b.length / ymax) * 40).attr('height', b => (b.length / ymax) * 40)
    .attr('rx', 1.5).attr('fill', `var(--m-${i.m})`).attr('opacity', 0.38);
  const mx = xs(i.len);
  svg.append('line').attr('class', 'mark').attr('x1', mx).attr('x2', mx).attr('y1', 10).attr('y2', 62);
  svg.append('circle').attr('class', 'mark-dot').attr('cx', mx).attr('cy', 10).attr('r', 4.5);
  svg.append('text').attr('x', 14).attr('y', 78).text(lenShort(i.m, ext[0]));
  svg.append('text').attr('x', width - 14).attr('y', 78).attr('text-anchor', 'end').text(lenShort(i.m, ext[1]));
  svg.append('text').attr('class', 'mark-label').attr('x', Math.max(40, Math.min(width - 40, mx))).attr('y', 78).attr('text-anchor', 'middle').text(lenShort(i.m, i.len));
  const pct = Math.round(100 * pool.filter(x => x.len < i.len).length / pool.length);
  return h('div', { class: 'lenviz' }, svg.node(),
    h('p', { class: 'lineage-cap' }, `${lengthText(i)}. Longer than ${pct}% of the ${LEN_NOUN[i.m]} on the map.`));
}

// ---------- the panel follows the map ----------
// After the viewer pans or zooms, show whatever is in view: the world when zoomed out, the continent
// nearest the centre at mid zoom, the region under the centre when close in. Clicks still pin things.
function autoFocus() {
  if (state.selCreator || state.selRoute) return;
  const k = transform.k;
  const [cx, cy] = transform.invert([Wpx / 2, Hpx / 2]);
  if (state.selItem) {
    const i = itemById.get(state.selItem), [sx, sy] = transform.apply([i.px, i.py]);
    if (sx > 0 && sx < Wpx && sy > 0 && sy < Hpx && k > 2) return;
  }
  const toLedger = () => { if (state.selProv || state.selCont || state.selItem) { clearSel(); renderLedger(); requestDraw(); } };
  if (k < 0.8) return toLedger();
  if (k < 1.9) {
    const c = d3.least(W.continents, c => Math.hypot(c.x - cx, c.y - cy) / c.r);
    if (Math.hypot(c.x - cx, c.y - cy) > c.r * 1.25) return toLedger();
    if (state.selCont !== c.id || state.selProv || state.selItem) { clearSel(); state.selCont = c.id; state.soft = true; renderContinent(c.id); requestDraw(); }
    return;
  }
  const near = qItems.find(cx, cy, 90 / k);
  if (!near) return;
  if (state.selProv !== near.p || state.selItem) { clearSel(); state.selProv = near.p; state.soft = true; renderProvince(near.p); requestDraw(); }
}

// ---------- key ----------
const keyEl = document.getElementById('key');
function renderKey() {
  const counts = countMedia(W.items);
  const kids = [h('h2', null, 'KEY'), h('p', { class: 'note' }, 'Colour and shape show the medium; each chip toggles its medium on the map.')];
  kids.push(h('div', { class: 'chips' }, MEDIA.map(m => h('button', {
      type: 'button', class: 'chip', id: `chip-${m}`, 'aria-pressed': state.hidden.has(m) ? 'false' : 'true',
      onclick: () => { state.hidden.has(m) ? state.hidden.delete(m) : state.hidden.add(m); renderKey(); requestDraw(); },
    }, glyphEl(m, 13), `${MEDIA_LABEL[m]} ${counts[m] || 0}`))));
  kids.push(h('div', { class: 'glyphs' },
    h('span', null, h('i', { class: 'g-size' }, h('b'), h('b'), h('b')), 'Bigger: your 9s (1.25×) and 10s (1.5×); games also grow with length'),
    h('span', null, h('i', { class: 'g-plan' }), 'Planned'),
    h('span', null, h('i', { class: 'g-ghost' }), 'Unexplored landmark')));
  keyEl.replaceChildren(...kids);
}

// ---------- search ----------
const searchEl = document.getElementById('search'), resultsEl = document.getElementById('search-results');
const fold = s => (s || '').toLowerCase().normalize('NFKD').replace(/\p{M}/gu, '');
const index = [
  ...W.continents.map(c => ({ kind: 'continent', id: c.id, label: c.name, sub: 'Continent', key: fold(c.name) })),
  ...W.provinces.map(p => ({ kind: 'province', id: p.id, label: p.name, sub: `Region · ${contById.get(p.c).name}`, key: fold(p.name) })),
  ...d3.groups(W.items.filter(i => i.c), i => i.c).filter(([, ws]) => ws.length >= 2).map(([name, ws]) =>
    ({ kind: 'creator', id: name, label: name, sub: `Creator · ${ws.length} works`, key: fold(name) })),
  ...W.items.map(i => ({ kind: 'item', id: i.id, label: i.t, sub: [MEDIA_LABEL[i.m], i.c, i.y].filter(Boolean).join(' · '), key: fold(i.t + ' ' + i.c), m: i.m })),
];
let results = [], active = -1;
function runSearch() {
  const q = fold(searchEl.value.trim());
  if (q.length < 2) { resultsEl.hidden = true; results = []; return; }
  results = index.filter(e => e.key.includes(q)).sort((a, b) => (a.key.startsWith(q) ? 0 : 1) - (b.key.startsWith(q) ? 0 : 1) || (a.kind === 'item') - (b.kind === 'item')).slice(0, 10);
  active = results.length ? 0 : -1;
  resultsEl.replaceChildren(...(results.length ? results.map((r, k) => h('li', {
    role: 'option', id: `res-${k}`, 'aria-selected': String(k === active),
    onmousedown: e => { e.preventDefault(); choose(r); },
  }, r.m ? glyphEl(r.m, 11) : h('i', { class: 'swatch', style: 'background:var(--ink-3)' }), h('span', null, r.label, h('small', null, r.sub))))
    : [h('li', { 'aria-disabled': 'true' }, h('span'), h('span', null, 'No works or regions match', h('small', null, 'Search covers titles, authors and region names')))]));
  resultsEl.hidden = false;
}
function choose(r) {
  resultsEl.hidden = true; searchEl.blur();
  if (r.kind === 'item') selectItem(r.id);
  else if (r.kind === 'province') selectProvince(r.id);
  else if (r.kind === 'creator') selectCreator(r.id);
  else selectContinent(r.id);
}
searchEl.addEventListener('input', runSearch);
searchEl.addEventListener('blur', () => setTimeout(() => { resultsEl.hidden = true; }, 120));
searchEl.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); if (!results.length) return;
    active = (active + (e.key === 'ArrowDown' ? 1 : -1) + results.length) % results.length;
    [...resultsEl.children].forEach((li, k) => li.setAttribute('aria-selected', String(k === active)));
  } else if (e.key === 'Enter' && results[active]) choose(results[active]);
  else if (e.key === 'Escape') { resultsEl.hidden = true; searchEl.value = ''; }
});

// ---------- phone bottom sheet ----------
const app = document.getElementById('app');
function openSheet() { app.classList.remove('sheet-closed'); panelToggle.setAttribute('aria-expanded', 'true'); }
panelToggle.addEventListener('click', () => {
  const closed = app.classList.toggle('sheet-closed');
  panelToggle.setAttribute('aria-expanded', String(!closed));
  setTimeout(resize, 260);
});

// ---------- boot ----------
readTokens();
buildGeometry();
new ResizeObserver(() => resize()).observe(stage);
resize();
fitWorld(0);
renderLedger();
renderKey();
document.getElementById('subtitle').textContent =
  `A survey of ${nf(W.items.filter(isConsumed).length)} works read, watched, played and heard, arranged by what they are rather than where they came from.`;
// Text measured or lettered before the web fonts arrived is redone with them.
if (document.fonts) document.fonts.ready.then(() => { LABELS.clear(); CHW.clear(); FIT.clear(); requestDraw(); });
const retheme = () => { readTokens(); renderKey(); requestDraw(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', retheme);
new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
</script>

</body></html>
